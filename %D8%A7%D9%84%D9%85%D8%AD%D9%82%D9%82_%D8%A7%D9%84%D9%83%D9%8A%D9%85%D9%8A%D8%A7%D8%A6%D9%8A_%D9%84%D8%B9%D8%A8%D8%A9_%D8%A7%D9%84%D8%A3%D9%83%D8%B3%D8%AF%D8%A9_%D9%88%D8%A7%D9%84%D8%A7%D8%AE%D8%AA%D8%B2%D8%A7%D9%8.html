<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحقق الكيميائي | لعبة الأكسدة والاختزال</title>
<style>
:root{--bg:#081525;--panel:#112840;--edge:#315270;--cyan:#56dbec;--gold:#ffd27d;--text:#f0f7ff;--muted:#b5c9da;--ok:#55dfac;--bad:#ff8c98}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 15% 0%,#173e5a,transparent 35%),linear-gradient(145deg,#071322,#0e223b);color:var(--text);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{max-width:1050px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(20px,3vw,30px);font-weight:bold}.tag{font-size:13px;color:var(--gold)}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{border:1px solid var(--edge);background:#10273e;border-radius:30px;padding:9px 15px}.progress{height:9px;background:#294358;border-radius:30px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#43badc,#6ce5b1);transition:width .4s}.card{background:linear-gradient(155deg,#142f48,#0e2035);border:1px solid #385672;border-radius:22px;padding:clamp(20px,4vw,40px);box-shadow:0 18px 55px #0005}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}.eyebrow{color:var(--cyan);font-weight:bold}.title{font-size:clamp(27px,5vw,48px);margin:12px 0}.subtitle{font-size:17px;line-height:2;color:#d5e6f3}.scene{border:1px solid #476882;background:radial-gradient(circle at 60% 30%,#1f536a,#071c2e 70%);border-radius:18px;padding:15px;min-height:250px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.scene svg{width:100%;max-height:260px}.cta,.secondary{border:0;border-radius:12px;padding:14px 24px;font-weight:700;margin-top:12px}.cta{background:var(--cyan);color:#052535}.cta:hover{background:#9af7ff}.secondary{background:#253f56;color:white;border:1px solid #587085}.stage{text-align:center;max-width:780px;margin:auto}.stage h1{font-size:clamp(24px,4vw,36px)}.story{line-height:1.95;color:#d6e8f6;font-size:17px}.evidence{background:#081b2e;border:1px dashed #6185a1;border-radius:14px;padding:20px;margin:22px auto;font-size:clamp(19px,3vw,26px);line-height:1.85;direction:rtl}.formula{direction:ltr;unicode-bidi:embed;display:inline-block;color:var(--gold);font-family:Arial,sans-serif;font-weight:bold}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px auto}.option{border:1px solid #557088;background:#1b3b56;color:white;border-radius:14px;padding:18px 14px;min-height:66px;font-size:17px}.option:hover:not(:disabled){border-color:var(--cyan);background:#27516a}.option:disabled{cursor:default;opacity:.88}.option.good{border-color:var(--ok);background:#205547}.option.bad{border-color:var(--bad);background:#623042}.feedback{margin:15px auto;line-height:1.9;border-radius:12px;padding:16px;text-align:right;background:#0a2137;border:1px solid #466883}.feedback strong{display:block;font-size:18px;margin-bottom:3px}.feedback.ok strong{color:var(--ok)}.feedback.no strong{color:var(--bad)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px}.lab{width:100%;height:175px;margin:14px auto;border-radius:14px;background:linear-gradient(#102c43,#092137);border:1px solid #40617c;display:flex;align-items:center;justify-content:space-around;position:relative;overflow:hidden}.atom{width:85px;height:85px;border-radius:50%;border:2px solid #87daec;display:grid;place-items:center;font-size:26px;font-weight:bold;background:#1f5772;box-shadow:0 0 30px #39cee344}.atom:last-child{border-color:#f6c779;background:#655036}.electron{position:absolute;right:22%;width:17px;height:17px;border-radius:50%;background:#f8ee97;box-shadow:0 0 13px #ffdf5c;animation:moveElectron 2.1s ease-in-out infinite alternate}.electron.two{animation-delay:.6s;top:62%}.electron.one{top:33%}@keyframes moveElectron{from{right:22%}to{right:75%}}.lab label{position:absolute;bottom:8px;font-size:12px;color:#cfdee9}.footer{margin:22px auto;text-align:center;color:#aac2d3;font-size:13px}.certificate{border:2px solid #e3bd75;border-radius:18px;padding:28px;background:linear-gradient(160deg,#203950,#0b2136);margin:25px auto;max-width:650px}.certificate h2{color:var(--gold)}.hide{display:none!important}.hint{color:var(--muted);font-size:14px}input[type=text]{background:#071e31;border:1px solid #52738a;border-radius:10px;color:#fff;padding:14px;font:inherit;width:min(100%,350px)}@media(max-width:700px){.hero{grid-template-columns:1fr}.options{grid-template-columns:1fr}.shell{padding:10px}.scene{min-height:200px}.top{justify-content:center;text-align:center}.stats{justify-content:center}.card{padding:20px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="shell">
<header class="top"><div><div class="brand">🔎 المحقق الكيميائي</div><div class="tag">مختبر الأكسدة والاختزال | المشروع التفاعلي</div></div><div class="stats"><span class="pill" id="levelLabel">المهمة: 0 / 8</span><span class="pill" id="scoreLabel">النقاط: 0</span><button class="secondary" id="soundBtn" style="margin:0;padding:8px 12px" aria-pressed="false">الصوت: مغلق</button></div></header>
<div class="progress" role="progressbar" aria-label="تقدم المهام" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0" id="progress"><div class="bar" id="bar"></div></div>
<main class="card" id="game" aria-live="polite"></main><p class="footer">المادة التعليمية: الأكسدة والاختزال • اللعبة تعمل دون إنترنت ولا تتطلب تثبيتًا</p></div>
<script>
'use strict';
const cases=[
{title:'ملف 1: الشريط المعدني',story:'وضع فني المختبر شريط مغنيسيوم في محلول يحوي أيونات النحاس. بدأت طبقة نحاسية تتكون على الشريط. ما نوع العملية التي تحدث للمغنيسيوم؟',evidence:'<span class="formula">Mg → Mg²⁺ + 2e⁻</span>',q:'كيف تصنّف ما حدث للمغنيسيوم؟',choices:['اختزال؛ لأنه اكتسب إلكترونات','أكسدة؛ لأنه فقد إلكترونات','تعادل؛ لأن الشحنة تغيّرت','لا يوجد تفاعل'],correct:1,explain:'فقد المغنيسيوم إلكترونين؛ وفقد الإلكترونات هو الأكسدة.'},
{title:'ملف 2: سر أيونات النحاس',story:'بعد أن فقد المغنيسيوم إلكتروناته، استقبلتها أيونات النحاس في المحلول وتحولت إلى نحاس فلزي.',evidence:'<span class="formula">Cu²⁺ + 2e⁻ → Cu</span>',q:'ماذا حدث لأيون النحاس؟',choices:['تأكسد باكتساب الإلكترونات','اختُزل باكتساب الإلكترونات','اختُزل بفقد الإلكترونات','لم يتغير'],correct:1,explain:'اكتساب الإلكترونات هو الاختزال، ولذلك تحوّل Cu²⁺ إلى Cu.'},
{title:'ملف 3: الأدلة الرقمية',story:'وجدت بطاقة على طاولة المختبر تحمل صيغة مركب: أكسيد الحديد الثلاثي. لفك القفل، حدّد عدد تأكسد الحديد.',evidence:'<span class="formula">Fe₂O₃</span><div class="hint">عدد تأكسد الأكسجين في هذا المركب = −2، ومجموع أعداد التأكسد في المركب المتعادل = 0.</div>',q:'ما عدد تأكسد الحديد؟',choices:['+2','+3','−3','0'],correct:1,explain:'ثلاث ذرات أكسجين مجموعها −6، لذلك يجب أن تكون ذرتا الحديد +6؛ لكل ذرة حديد +3.'},
{title:'ملف 4: اختبار التغير',story:'قارن المحقق الكيميائي عدد التأكسد لذرة الكبريت قبل التفاعل وبعده.',evidence:'<span class="formula">S: +4 → +6</span>',q:'أي عملية حدثت للكبريت؟',choices:['اختزال','أكسدة','تعادل','لا يمكن تحديدها'],correct:1,explain:'ارتفاع عدد التأكسد من +4 إلى +6 يعني حدوث أكسدة.'},
{title:'ملف 5: هوية العامل',story:'في تفاعل المغنيسيوم مع أيونات النحاس، تسبّب المغنيسيوم في اختزال أيونات النحاس لأنه منحها إلكترونات.',evidence:'<span class="formula">Mg + Cu²⁺ → Mg²⁺ + Cu</span>',q:'من هو العامل المختزِل في هذا التفاعل؟',choices:['Mg','Cu²⁺','Mg²⁺','Cu'],correct:0,explain:'العامل المختزِل هو المادة التي تمنح إلكترونات لغيرها، وهي نفسها تتأكسد. هنا المغنيسيوم Mg.'},
{title:'ملف 6: هوية العامل الثاني',story:'استعد دراسة التفاعل نفسه. ابحث هذه المرة عن المادة التي أخذت الإلكترونات، فأحدثت أكسدة للمغنيسيوم.',evidence:'<span class="formula">Mg + Cu²⁺ → Mg²⁺ + Cu</span>',q:'ما العامل المؤكسِد في التفاعل؟',choices:['Mg','Cu','Mg²⁺','Cu²⁺'],correct:3,explain:'العامل المؤكسِد يستقبل الإلكترونات ويُختزل بنفسه؛ وهو Cu²⁺.'},
{title:'ملف 7: معادلة ناقصة',story:'عُثر على ورقة تتضمن نصف تفاعل الزنك، لكن أحد الطلاب أضاع عدد الإلكترونات. أكمل الدليل لإعادة فتح المختبر.',evidence:'<span class="formula">Zn → Zn²⁺ + ? e⁻</span>',q:'كم إلكترونًا فقد الزنك؟',choices:['1','2','3','4'],correct:1,explain:'للحفاظ على توازن الشحنة: 0 = +2 + (−2)، لذلك يخرج إلكترونان.'},
{title:'ملف 8: قضية الصدأ',story:'وصلت إلى القضية الأخيرة: مسمار حديد تعرّض للماء والأكسجين وتكوّن عليه الصدأ. ساعد المختبر في كتابة التقرير الختامي.',evidence:'<span class="formula">Fe → Fe²⁺ + 2e⁻</span><div class="hint">هذا نصف تفاعل يُمثل جزءًا من خطوات تآكل الحديد.</div>',q:'أي عبارة تصف ما يحدث للحديد وصفًا صحيحًا؟',choices:['يكتسب إلكترونات ويتعرض للاختزال','يفقد إلكترونات ويتأكسد','يتحول إلى عامل مؤكسِد دائمًا','لا تتغير شحنته'],correct:1,explain:'الحديد يفقد إلكترونات ويتأكسد. يحتاج تكوّن الصدأ أيضًا إلى تفاعلات اختزال مصاحبة، مثل اختزال الأكسجين في وجود الماء.'}
];
const game=document.getElementById('game');let level=-1,score=0,answered=false,mistakes=0,enabledSound=false,name='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const visual=`<svg viewBox="0 0 400 270" role="img" aria-label="حقيبة محقق وعدسة مكبرة وأنابيب اختبار"><rect x="35" y="50" width="325" height="180" rx="16" fill="#102c44" stroke="#72b9cf" stroke-width="4"/><path d="M143 50v-17q0-13 15-13h80q15 0 15 13v17" fill="none" stroke="#d2b47b" stroke-width="9"/><rect x="65" y="86" width="120" height="100" rx="8" fill="#234762"/><path d="M105 100v70m30-70v70" stroke="#93ddea" stroke-width="12" stroke-linecap="round"/><path d="M99 136h12v35h-12z" fill="#eb9fc6"/><path d="M129 116h12v55h-12z" fill="#6be1e8"/><circle cx="253" cy="131" r="57" fill="#10314e" fill-opacity=".7" stroke="#d5e5ed" stroke-width="13"/><path d="M212 172l-47 47" stroke="#c9935f" stroke-width="19" stroke-linecap="round"/><circle cx="253" cy="131" r="43" fill="#63c8e1" fill-opacity=".15"/><g fill="#e6e0a5"><circle cx="251" cy="104" r="6"/><circle cx="278" cy="143" r="6"/><circle cx="232" cy="146" r="6"/></g></svg>`;
function sound(success){if(!enabledSound)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.value=success?660:220;gain.gain.setValueAtTime(.08,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);osc.start();osc.stop(ctx.currentTime+.2);osc.onended=()=>ctx.close()}catch(e){}}
document.getElementById('soundBtn').addEventListener('click',()=>{enabledSound=!enabledSound;const b=document.getElementById('soundBtn');b.textContent=enabledSound?'الصوت: يعمل':'الصوت: مغلق';b.setAttribute('aria-pressed',String(enabledSound))});
function update(){document.getElementById('levelLabel').textContent=`المهمة: ${Math.max(0,Math.min(level+1,8))} / 8`;document.getElementById('scoreLabel').textContent=`النقاط: ${score}`;document.getElementById('bar').style.width=`${Math.max(0,Math.min(level,8))/8*100}%`;document.getElementById('progress').setAttribute('aria-valuenow',Math.max(0,Math.min(level,8)))}
function start(){level=-1;score=0;mistakes=0;update();game.innerHTML=`<div class="hero"><div><div class="eyebrow">القضية 02 | سر الأكسدة والاختزال</div><h1 class="title">مرحبًا بك في مختبر المحقق الكيميائي!</h1><p class="subtitle">اختفت أدلة مهمة من المختبر. أمامك <b>8 ملفات تحقيق</b>، ولكل ملف سؤال يكشف سرّ انتقال الإلكترونات وأعداد التأكسد. حلّ القضايا واجمع النقاط للحصول على شهادة المحقق الكيميائي.</p><label for="studentName" class="hint">اسم المحقق (اختياري)</label><div><input id="studentName" type="text" maxlength="40" placeholder="اكتب اسمك هنا" aria-label="اسم المحقق"></div><button class="cta" id="begin">ابدأ التحقيق ←</button></div><div class="scene">${visual}</div></div>`;document.getElementById('begin').onclick=()=>{name=document.getElementById('studentName').value.trim();level=0;renderCase()}}
function renderCase(){answered=false;update();let c=cases[level];game.innerHTML=`<section class="stage"><div class="eyebrow">ملف التحقيق ${level+1} من 8</div><h1>${c.title}</h1><p class="story">${c.story}</p>${level===7?'<div class="lab" aria-label="انتقال الإلكترونات في تفاعل أكسدة واختزال"><span class="atom">Fe</span><span class="electron one"></span><span class="electron two"></span><span class="atom">Fe²⁺</span><label>تمثيل حركي تعليمي للإلكترونات (غير مقياسي)</label></div>':''}<div class="evidence">${c.evidence}</div><h2>${c.q}</h2><div class="options" id="choices">${c.choices.map((opt,i)=>`<button class="option" data-choice="${i}">${esc(opt)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="hint">تلميح علمي</button></div></section>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.choice)));document.getElementById('hint').onclick=()=>{document.getElementById('hint').remove();const d=document.createElement('div');d.className='feedback';d.textContent=level===2?'اجمع أعداد التأكسد واضبط مجموعها ليساوي صفرًا.':level===4||level===5?'المادة التي تفقد الإلكترونات عامل مختزِل، والمادة التي تكتسبها عامل مؤكسِد.':'تذكّر: الأكسدة فقد إلكترونات، والاختزال اكتساب إلكترونات. وزيادة عدد التأكسد تدل على الأكسدة.';document.querySelector('.actions').before(d)}}
function pick(choice){if(answered)return;answered=true;const c=cases[level],good=choice===c.correct;score+=good?10:0;mistakes+=good?0:1;sound(good);document.querySelectorAll('[data-choice]').forEach((b,i)=>{b.disabled=true;if(i===c.correct)b.classList.add('good');else if(i===choice)b.classList.add('bad')});document.getElementById('feedback').innerHTML=`<div class="feedback ${good?'ok':'no'}"><strong>${good?'أحسنت! +10 نقاط':'ليست الإجابة الصحيحة، لكنك اكتشفت دليلًا جديدًا.'}</strong>${c.explain}</div><button class="cta" id="next">${level===7?'عرض التقرير النهائي':'الانتقال إلى الملف التالي'} ←</button>`;document.getElementById('next').onclick=()=>{level++;if(level<8)renderCase();else finish()};update()}
function finish(){update();document.getElementById('bar').style.width='100%';document.getElementById('progress').setAttribute('aria-valuenow','8');const title=score===80?'محقق كيميائي خبير':score>=50?'محقق كيميائي متميز':'محقق كيميائي متدرّب';game.innerHTML=`<section class="stage"><div class="eyebrow">تم إغلاق القضية بنجاح</div><h1>التقرير النهائي للمختبر</h1><p class="story">انتهت مهمات التحقيق الثماني. أثبتَّ أن فهم انتقال الإلكترونات وأعداد التأكسد يساعد على تفسير تغيرات المواد، ومنها الصدأ.</p><div class="certificate" id="certificate"><div style="font-size:42px">🏅</div><h2>شهادة المحقق الكيميائي</h2><p>تُمنح إلى <b>${esc(name||'المحقق المشارك')}</b></p><h3>${title}</h3><p>النتيجة: <b>${score} من 80</b> (${Math.round(score/80*100)}%)</p><p>الإجابات الصحيحة: ${8-mistakes} من 8</p><small>مشروع تفاعلي تعليمي في الأكسدة والاختزال</small></div><div class="actions"><button class="cta" id="again">إعادة التحقيق</button><button class="secondary" id="print">طباعة الشهادة / حفظ PDF</button></div><p class="hint">عند الطباعة اختر «حفظ بتنسيق PDF» إذا رغبت في نسخة إلكترونية.</p></section>`;document.getElementById('again').onclick=start;document.getElementById('print').onclick=()=>{const html=document.getElementById('certificate').outerHTML;const w=window.open('','_blank');if(!w){alert('يرجى السماح بفتح نافذة الطباعة.');return}w.document.write(`<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>شهادة المحقق الكيميائي</title><style>body{font-family:Tahoma,Arial,sans-serif;text-align:center;padding:45px;color:#12283d}.certificate{border:5px double #ba9045;border-radius:20px;padding:50px;max-width:700px;margin:auto}h2{color:#85601d;font-size:36px}h3{font-size:27px}</style>${html}</html>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)}}
start();
</script></body></html>
